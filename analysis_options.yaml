include: package:lints/recommended.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # Сайт на Astro вне pub workspace: без Dart-кода, с node_modules (ADR-0003, D1).
    - site/**

linter:
  rules:
    avoid_print: true
    prefer_final_locals: true
    require_trailing_commas: true
    sort_pub_dependencies: true
