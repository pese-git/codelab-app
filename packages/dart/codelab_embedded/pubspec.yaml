name: codelab_embedded
description: Embedded CodeLab agent — the bridge that assembles the Dart agent core in the client process over an in-memory ACP link.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.8.0 <4.0.0"

# allowlist — workspace-architecture «Автоматический сторож границ пакетов»
# (embeddedAllowlist; design.md change `add-embedded-agent-mode`, D3). Клиентских
# пакетов и Flutter здесь нет: клиенты зависят от моста, а не он от них.
# `codelab_agent_mcp` пришёл с `lib/io.dart` (итерация 2, MCP-коннектор хоста).
dependencies:
  codelab_acp_protocol:
    path: ../codelab_acp_protocol
  codelab_acp_transports:
    path: ../codelab_acp_transports
  codelab_agent_acp:
    path: ../codelab_agent_acp
  codelab_agent_core:
    path: ../codelab_agent_core
  codelab_agent_io:
    path: ../codelab_agent_io
  codelab_agent_mcp:
    path: ../codelab_agent_mcp
  http: ^1.5.0

# Замер benchmark/stream_latency_benchmark.dart берёт настоящий клиентский слой
# (design.md change `add-embedded-agent-mode`, D11). Это dev-зависимости: сторож
# allowlist читает только `dependencies`, а импорт `codelab_client_*` из
# `benchmark/` вне `lib/**`, который сканирует сторож импортов.
dev_dependencies:
  codelab_client_acp:
    path: ../codelab_client_acp
  codelab_client_core:
    path: ../codelab_client_core
  lints: ^6.0.0
  test: ^1.26.3
