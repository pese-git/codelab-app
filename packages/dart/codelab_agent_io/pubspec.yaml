name: codelab_agent_io
description: dart:io implementations of the CodeLab agent core ports — local files, processes and session journals.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies: # allowlist §1.2; расширение — только через OpenSpec
  async: ^2.12.0
  codelab_agent_core:
    path: ../codelab_agent_core
  meta: ^1.16.0
  # Разбор config.yaml и frontmatter с позициями ошибок; единственная новая
  # прямая зависимость change `add-agent-configuration` (design.md, D2).
  # `toml` не нужен: codelab.toml не читается (D12).
  yaml: ^3.1.3
  # Правка config.yaml с сохранением комментариев, порядка ключей и стиля;
  # потребитель — `ConfigWriter` (change `add-config-writer-and-reload`, D2,
  # решение о технологии — D2 change `add-agent-configuration`). Версия в
  # `pubspec.lock` та же (2.2.4), меняется лишь вид зависимости.
  yaml_edit: ^2.2.4

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.3
