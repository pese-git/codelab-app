name: acp_client_kit
description: Pure Dart ACP client layer shared by CodeLab clients (workspace, sessions, connection state).
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  acp_client_core:
    path: ../acp_client_core
  acp_protocol:
    path: ../acp_protocol
  acp_transports:
    path: ../acp_transports
  freezed_annotation: ^3.1.0
  meta: ^1.16.0

dev_dependencies:
  acp_testing:
    path: ../acp_testing
  build_runner: ^2.10.5
  freezed: ^3.2.5
  lints: ^6.0.0
  test: ^1.26.3
