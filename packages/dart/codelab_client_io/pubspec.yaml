version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  codelab_acp_protocol:
    path: ../codelab_acp_protocol
  codelab_acp_transports:
    path: ../codelab_acp_transports
  codelab_client_acp:
    path: ../codelab_client_acp
  codelab_client_core:
    path: ../codelab_client_core

dev_dependencies:
  codelab_acp_testing:
    path: ../codelab_acp_testing
  lints: ^6.0.0
  test: ^1.26.3
