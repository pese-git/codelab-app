name: codelab_client_core
description: Pure Dart ACP client layer shared by CodeLab clients (workspace, sessions, connection state).
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  codelab_acp_protocol:
    path: ../codelab_acp_protocol
  codelab_acp_transports:
    path: ../codelab_acp_transports
  codelab_client_acp:
    path: ../codelab_client_acp
  freezed_annotation: ^3.1.0
  meta: ^1.16.0

dev_dependencies:
  build_runner: ^2.10.5
  codelab_acp_testing:
    path: ../codelab_acp_testing
  freezed: ^3.2.5
  lints: ^6.0.0
  test: ^1.26.3
