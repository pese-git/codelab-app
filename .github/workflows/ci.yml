name: ci

on:
  push:
    branches: [master, develop]
  pull_request:
  schedule:
    - cron: "0 3 * * *" # nightly run of the Dart VM suites

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Integration tests run on the Dart VM only: real processes and sockets in the
# package tests, the ACP fixture corpus, and (stage 6) the CLI PTY e2e. The
# Flutter macOS app tests (`melos run test:e2e:app:*`) are a local acceptance
# gate and are not run in GitHub CI.
jobs:
  checks:
    name: ${{ matrix.job }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { job: format, scripts: "check-format" }
          - { job: analyze, scripts: "analyze" }
          - { job: test, scripts: "test" }
          - { job: conformance, scripts: "protocol-conformance conformance:client conformance:agent" }
          - { job: guard, scripts: "guard prompts:check" }
          - { job: web-compile, scripts: "web-compile" } # + flutter build web (stage 10)
          # stage 6: { job: e2e-cli, scripts: "build:cli test:e2e:cli" } — CLI PTY e2e on the Dart VM
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
      - run: for s in ${{ matrix.scripts }}; do fvm dart run melos run "$s" || exit 1; done
