name: codelab_cli
description: CodeLab terminal client — REPL and headless `codelab -p` over ACP.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.8.0 <4.0.0"

executables:
  codelab: codelab

dependencies: # allowlist — workspace-architecture «Автоматический сторож границ пакетов»
  args: ^2.7.0
  # Только `lib/src/scenario/` — драйвер фикстур `test-scenario` (design.md
  # change `add-codelab-cli`, D3; правило сторожа).
  codelab_acp_testing:
    path: ../../packages/dart/codelab_acp_testing
  codelab_acp_protocol:
    path: ../../packages/dart/codelab_acp_protocol
  codelab_acp_transports:
    path: ../../packages/dart/codelab_acp_transports
  codelab_client_acp:
    path: ../../packages/dart/codelab_client_acp
  codelab_client_core:
    path: ../../packages/dart/codelab_client_core
  codelab_client_io:
    path: ../../packages/dart/codelab_client_io
  # Мост настроек агента: `codelab config check` (design.md change
  # `add-agent-configuration`, D14); вместо прямого `codelab_agent_*`.
  codelab_setup:
    path: ../../packages/dart/codelab_setup
  # Только адаптер полноэкранного режима `lib/src/tui/`, не ядро экрана
  # `lib/src/tui/core/` (design.md change `add-cli-tui`, D3; правило сторожа).
  dart_tui: ^3.0.0
  meta: ^1.16.0
  path: ^1.9.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.3
