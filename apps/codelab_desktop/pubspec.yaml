name: codelab_desktop
description: Desktop CodeLab ACP client application.
version: 0.1.0+1
publish_to: none
resolution: workspace

environment:
  # >=3.11.0 — требование pty2 (D11 change add-integrated-terminal); корень и
  # остальные пакеты workspace не меняются.
  sdk: ">=3.11.0 <4.0.0"
  # >=3.41.0 — требование url_launcher 6.3.3 (D11 «Граница SDK»).
  flutter: ">=3.41.0"

dependencies:
  codelab_client_acp:
    path: ../../packages/dart/codelab_client_acp
  codelab_client_io:
    path: ../../packages/dart/codelab_client_io
  codelab_client_core:
    path: ../../packages/dart/codelab_client_core
  codelab_acp_protocol:
    path: ../../packages/dart/codelab_acp_protocol
  codelab_acp_transports:
    path: ../../packages/dart/codelab_acp_transports
  codelab_embedded:
    path: ../../packages/dart/codelab_embedded
  codelab_setup:
    path: ../../packages/dart/codelab_setup
  codelab_ui:
    path: ../../packages/flutter/codelab_ui
  cherrypick: ^4.0.0-dev.3
  cherrypick_annotations: ^4.0.0-dev.0
  file_selector: ^1.1.0
  fluent_ui: ^4.11.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  fpdart: ^1.2.0
  # Версию intl закрепляет flutter_localizations SDK (D3 change add-desktop-localization).
  intl: any
  path: ^1.9.0
  path_provider: ^2.1.5
  pty2: 0.8.1
  shared_preferences: ^2.5.5
  structured_log: 0.3.1
  structured_log_flutter: 0.1.3
  structured_log_fluent: 0.1.2+2
  structured_log_remote_sync: 0.2.1
  # Приём перетаскивания файлов и папок из ОС (add-empty-project-screen, D3,
  # technology-stack §20и): точный пин 0.8.4 — 0.9.x требует Flutter >=3.47.7.
  # Импорт — только core/platform/os_drop_region.dart (правило сторожа).
  desktop_drop: 0.8.4
  # Системный акцент (add-app-appearance-page, D7, technology-stack §20з): точный
  # пин, API пакета меняется между минорными версиями; импорт — только
  # core/platform/system_accent_source.dart (правило сторожа).
  system_theme: 3.3.0
  url_launcher: 6.3.3
  xterm2: 5.4.0
  xterm2_core: 1.0.0

dev_dependencies:
  codelab_acp_testing:
    path: ../../packages/dart/codelab_acp_testing
  build_runner: ^2.10.5
  cherrypick_generator: ^4.0.0-dev.2
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  freezed: ^3.2.5
  msix: ^3.18.0

flutter:
  generate: true
  uses-material-design: true
  # Копии корневых LICENSE и THIRD_PARTY_NOTICES.md для раздела «About»
  # (change `add-app-general-page`, D13): Flutter не принимает ресурсы вне
  # каталога пакета; побайтное равенство с корнем проверяет
  # `test/app/legal_assets_test.dart`.
  assets:
    # Правовые документы страницы «Legal» (change `add-app-legal-page`, D4):
    # копии корневых PRIVACY/TERMS на двух языках; побайтное равенство и
    # объявление каждого файла проверяет `test/app/legal_assets_test.dart`.
    - assets/legal/PRIVACY.md
    - assets/legal/PRIVACY.ru.md
    - assets/legal/TERMS.md
    - assets/legal/TERMS.ru.md
    - assets/legal/LICENSE
    - assets/legal/THIRD_PARTY_NOTICES.md

msix_config:
  display_name: CodeLab Desktop
  publisher_display_name: CodeLab
  identity_name: com.example.codelabDesktop
  msix_version: 0.1.0.1
  sign_msix: true
  install_certificate: false