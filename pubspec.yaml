name: codelab_workspace
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"

dev_dependencies:
  lints: ^6.0.0
  melos: ^8.3.0

workspace:
  - apps/codelab_app
  - packages/dart/acp_client_core
  - packages/dart/acp_protocol
  - packages/dart/acp_testing
  - packages/dart/acp_transports
  - packages/dart/codelab_agent_core
  - packages/dart/codelab_agent_io
  - packages/dart/codelab_architecture_tests
  - packages/flutter/acp_ui

melos:
  scripts:
    format:
      description: Format all Dart and Flutter packages.
      run: fvm dart format .

    check-format:
      description: Check Dart formatting without applying changes.
      run: fvm dart format --output=none --set-exit-if-changed .

    analyze:
      description: Run static analysis across the workspace.
      run: fvm dart analyze

    test:
      description: Run all Dart and Flutter tests.
      run: fvm dart run melos exec -c 1 --dir-exists=test --fail-fast -- "fvm flutter test"

    protocol-conformance:
      description: Run ACP protocol conformance checks.
      run: fvm dart test packages/dart/acp_protocol/test

    conformance:client:
      description: Play the golden ACP fixture corpus against AcpClientApplication (client role).
      run: fvm dart test packages/dart/acp_client_core/test/fixtures

    test:dart:
      description: Run tests of pure Dart packages with the Dart test runner.
      run: fvm dart run melos exec -c 4 --no-flutter --dir-exists=test --fail-fast -- "fvm dart test"

    guard:
      description: Run architecture guards — forbidden imports and the core dependency allowlist.
      run: fvm dart test packages/dart/codelab_architecture_tests

    prompts:check:
      description: Check that the generated prompt constants of the agent core match prompts/**/*.md.
      run: cd packages/dart/codelab_agent_core && fvm dart run tool/gen_prompts.dart --check

    web-compile:
      description: Compile the agent core web-smoke entry point to JavaScript and WebAssembly.
      run: >-
        fvm dart compile js -O1 -o build/web_smoke/core.js packages/dart/codelab_agent_core/test/web_smoke/main.dart &&
        fvm dart compile wasm -o build/web_smoke/core.wasm packages/dart/codelab_agent_core/test/web_smoke/main.dart

    test:e2e:app:stdio:
      description: Run codelab_app macOS stdio connection integration tests.
      run: fvm dart run melos exec --scope=codelab_app -- "fvm flutter test integration_test/stdio_connect_flow_test.dart -d macos --dart-define=CODELAB_E2E_DART=../../.fvm/flutter_sdk/bin/dart"

    test:e2e:app:permission:
      description: Run codelab_app macOS permission-request (approval) integration test.
      run: fvm dart run melos exec --scope=codelab_app -- "fvm flutter test integration_test/permission_flow_test.dart -d macos --dart-define=CODELAB_E2E_DART=../../.fvm/flutter_sdk/bin/dart"

    test:e2e:app:fs:
      description: Run codelab_app macOS fs/read_text_file + fs/write_text_file integration test.
      run: fvm dart run melos exec --scope=codelab_app -- "fvm flutter test integration_test/fs_flow_test.dart -d macos --dart-define=CODELAB_E2E_DART=../../.fvm/flutter_sdk/bin/dart"

    test:e2e:app:open-project:
      description: Run codelab_app macOS "Open Project" picker integration tests.
      run: fvm dart run melos exec --scope=codelab_app -- "fvm flutter test integration_test/open_project_flow_test.dart -d macos --dart-define=CODELAB_E2E_DART=../../.fvm/flutter_sdk/bin/dart"

    test:e2e:app:terminal:
      description: Run codelab_app macOS terminal/* integration tests.
      run: fvm dart run melos exec --scope=codelab_app -- "fvm flutter test integration_test/terminal_flow_test.dart -d macos --dart-define=CODELAB_E2E_DART=../../.fvm/flutter_sdk/bin/dart"

    test:e2e:app:plan-checklist:
      description: Run codelab_app macOS plan progress checklist integration test.
      run: fvm dart run melos exec --scope=codelab_app -- "fvm flutter test integration_test/plan_progress_checklist_flow_test.dart -d macos --dart-define=CODELAB_E2E_DART=../../.fvm/flutter_sdk/bin/dart"

    test:e2e:app:prompt-queue:
      description: Run codelab_app macOS prompt queue integration test.
      run: fvm dart run melos exec --scope=codelab_app -- "fvm flutter test integration_test/prompt_queue_flow_test.dart -d macos --dart-define=CODELAB_E2E_DART=../../.fvm/flutter_sdk/bin/dart"

    test:e2e:app:multi-session:
      description: Run codelab_app macOS multi-session concurrency integration test.
      run: fvm dart run melos exec --scope=codelab_app -- "fvm flutter test integration_test/multi_session_concurrency_flow_test.dart -d macos --dart-define=CODELAB_E2E_DART=../../.fvm/flutter_sdk/bin/dart"

    check:
      description: Run format, analyze, guard, tests, protocol and client fixture conformance, and web compile.
      steps:
        - check-format
        - analyze
        - guard
        - prompts:check
        - test
        - protocol-conformance
        - conformance:client
        - web-compile
