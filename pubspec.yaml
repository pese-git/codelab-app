name: codelab_workspace
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"

dev_dependencies:
  lints: ^6.0.0
  melos: ^8.3.0

workspace:
  - apps/codelab_agent
  - apps/codelab_desktop
  - packages/dart/codelab_client_acp
  - packages/dart/codelab_client_io
  - packages/dart/codelab_client_core
  - packages/dart/codelab_acp_protocol
  - packages/dart/codelab_acp_testing
  - packages/dart/codelab_acp_transports
  - packages/dart/codelab_agent_acp
  - packages/dart/codelab_agent_core
  - packages/dart/codelab_agent_io
  - packages/dart/codelab_architecture_tests
  - packages/flutter/codelab_ui

melos:
  scripts:
    format:
      description: Format all Dart and Flutter packages.
      run: fvm dart format .

    check-format:
      description: Check Dart formatting without applying changes.
      run: fvm dart format --output=none --set-exit-if-changed .

    analyze:
      description: Run static analysis across the workspace.
      run: fvm dart analyze

    test:
      description: Run all Dart and Flutter tests.
      run: fvm dart run melos exec -c 1 --dir-exists=test --fail-fast -- "fvm flutter test"

    protocol-conformance:
      description: Run ACP protocol conformance checks.
      run: fvm dart test packages/dart/codelab_acp_protocol/test

    conformance:client:
      description: Play the golden ACP fixture corpus against AcpClientApplication (client role).
      run: fvm dart test packages/dart/codelab_client_acp/test/fixtures

    conformance:agent:
      description: Play the golden ACP fixture corpus against AcpAgentServer (agent role).
      run: fvm dart test packages/dart/codelab_agent_acp/test/conformance_test.dart

    test:dart:
      description: Run tests of pure Dart packages with the Dart test runner.
      run: fvm dart run melos exec -c 4 --no-flutter --dir-exists=test --fail-fast -- "fvm dart test"

    guard:
      description: Run architecture guards — forbidden imports and the core dependency allowlist.
      run: fvm dart test packages/dart/codelab_architecture_tests

    prompts:check:
      description: Check that the generated prompt constants of the agent core match prompts/**/*.md.
      run: cd packages/dart/codelab_agent_core && fvm dart run tool/gen_prompts.dart --check

    web-compile:
      description: Compile the agent core web-smoke entry point to JavaScript and WebAssembly.
      run: >-
        fvm dart compile js -O1 -o build/web_smoke/core.js packages/dart/codelab_agent_core/test/web_smoke/main.dart &&
        fvm dart compile wasm -o build/web_smoke/core.wasm packages/dart/codelab_agent_core/test/web_smoke/main.dart

    test:e2e:app:stdio:
      description: Run codelab_desktop macOS stdio connection integration tests.
      run: fvm dart run melos exec --scope=codelab_desktop -- "fvm flutter test integration_test/stdio_connect_flow_test.dart -d macos --dart-define=CODELAB_E2E_DART=../../.fvm/flutter_sdk/bin/dart"

    test:e2e:app:permission:
      description: Run codelab_desktop macOS permission-request (approval) integration test.
      run: fvm dart run melos exec --scope=codelab_desktop -- "fvm flutter test integration_test/permission_flow_test.dart -d macos --dart-define=CODELAB_E2E_DART=../../.fvm/flutter_sdk/bin/dart"

    test:e2e:app:fs:
      description: Run codelab_desktop macOS fs/read_text_file + fs/write_text_file integration test.
      run: fvm dart run melos exec --scope=codelab_desktop -- "fvm flutter test integration_test/fs_flow_test.dart -d macos --dart-define=CODELAB_E2E_DART=../../.fvm/flutter_sdk/bin/dart"

    test:e2e:app:open-project:
      description: Run codelab_desktop macOS "Open Project" picker integration tests.
      run: fvm dart run melos exec --scope=codelab_desktop -- "fvm flutter test integration_test/open_project_flow_test.dart -d macos --dart-define=CODELAB_E2E_DART=../../.fvm/flutter_sdk/bin/dart"

    test:e2e:app:terminal:
      description: Run codelab_desktop macOS terminal/* integration tests.
      run: fvm dart run melos exec --scope=codelab_desktop -- "fvm flutter test integration_test/terminal_flow_test.dart -d macos --dart-define=CODELAB_E2E_DART=../../.fvm/flutter_sdk/bin/dart"

    test:e2e:app:plan-checklist:
      description: Run codelab_desktop macOS plan progress checklist integration test.
      run: fvm dart run melos exec --scope=codelab_desktop -- "fvm flutter test integration_test/plan_progress_checklist_flow_test.dart -d macos --dart-define=CODELAB_E2E_DART=../../.fvm/flutter_sdk/bin/dart"

    test:e2e:app:prompt-queue:
      description: Run codelab_desktop macOS prompt queue integration test.
      run: fvm dart run melos exec --scope=codelab_desktop -- "fvm flutter test integration_test/prompt_queue_flow_test.dart -d macos --dart-define=CODELAB_E2E_DART=../../.fvm/flutter_sdk/bin/dart"

    test:e2e:app:multi-session:
      description: Run codelab_desktop macOS multi-session concurrency integration test.
      run: fvm dart run melos exec --scope=codelab_desktop -- "fvm flutter test integration_test/multi_session_concurrency_flow_test.dart -d macos --dart-define=CODELAB_E2E_DART=../../.fvm/flutter_sdk/bin/dart"

    test:e2e:app:command-palette:
      description: Run codelab_desktop macOS command palette with agent commands integration test (R-20).
      run: fvm dart run melos exec --scope=codelab_desktop -- "fvm flutter test integration_test/command_palette_flow_test.dart -d macos --dart-define=CODELAB_E2E_DART=../../.fvm/flutter_sdk/bin/dart"

    build:agent:
      description: Compile the codelab-agent binary to build/bin/codelab-agent (not part of check).
      run: mkdir -p build/bin && fvm dart compile exe apps/codelab_agent/bin/codelab_agent.dart -o build/bin/codelab-agent

    test:e2e:app:dart-agent:
      description: Build codelab-agent and run every codelab_desktop macOS integration test except scripted-only against it, one file per flutter test run (release/* only).
      # По одному файлу на запуск: `flutter test integration_test -d macos`
      # на macOS не поднимает приложение после первого файла («Failed to
      # foreground app; open returned 1»). Код выхода — ненулевой, если упал
      # хотя бы один файл; остальные файлы всё равно прогоняются. Код 79 —
      # «No tests ran» из package:test: в файле только scripted-only тесты,
      # это пропуск файла, а не падение.
      run: >-
        fvm dart run melos run build:agent &&
        cd apps/codelab_desktop && {
        status=0;
        for file in integration_test/*_test.dart; do
        echo "== $file";
        fvm flutter test "$file" -d macos --exclude-tags scripted-only --dart-define=CODELAB_E2E_AGENT=dart --dart-define=CODELAB_E2E_AGENT_BIN=../../build/bin/codelab-agent;
        code=$?;
        if [ $code -eq 79 ]; then echo "SKIPPED (scripted-only): $file";
        elif [ $code -ne 0 ]; then echo "FAILED: $file"; status=1; fi;
        done;
        exit $status;
        }

    check:
      description: Run format, analyze, guard, tests, protocol, client and agent fixture conformance, and web compile.
      steps:
        - check-format
        - analyze
        - guard
        - prompts:check
        - test
        - protocol-conformance
        - conformance:client
        - conformance:agent
        - web-compile
