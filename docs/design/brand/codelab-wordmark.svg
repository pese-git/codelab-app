<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 85 1290 230">
  <!-- Надпись «CodeLab» линиями, без шрифта: толщина 30 и скруглённые концы
       как у колбы в codelab-glyph.svg, поэтому знак и надпись читаются одним
       почерком и не зависят от установленных шрифтов и их лицензий.
       Сетка: прописные 100..300, строчные 150..300, базовая линия y=300.
       Цвета задают классы: .code — «Code», .lab — «Lab» (акцент #005FB8);
       генератор логотипа подменяет их для тёмной темы. -->
  <style>.code{stroke:#1A1A1A}.lab{stroke:#005FB8}</style>
  <g fill="none" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <g class="code">
      <path d="M170.7 129.3 A100 100 0 1 0 170.7 270.7"/>
      <circle cx="295" cy="225" r="75"/>
      <circle cx="485" cy="225" r="75"/>
      <path d="M560 100 V300"/>
      <path d="M595 225 H745 A75 75 0 1 0 723 278"/>
    </g>
    <g class="lab">
      <path d="M800 100 V300 H890"/>
      <circle cx="990" cy="225" r="75"/>
      <path d="M1065 150 V300"/>
      <path d="M1110 100 V300"/>
      <circle cx="1185" cy="225" r="75"/>
    </g>
  </g>
</svg>
